# ============================================================================
# КОНФИГУРАЦИЯ ANSIBLE
# Оптимизирована для работы с динамическим инвентарём от Terraform
# ============================================================================

[defaults]
# Путь к инвентарю по умолчанию (переопределяется через -i в CLI)
inventory = ./inventory.yml

# Отключаем host key checking для автоматизации (в prod используйте known_hosts!)
host_key_checking = False

# Таймауты для медленных операций (установка пакетов, сборка)
timeout = 60
deprecation_warnings = False

# Формат вывода: компактный, но информативный
stdout_callback = yaml
bin_ansible_callbacks = True

# Количество параллельных хостов (для небольших инфраструктур)
forks = 5

# Использование fact caching для ускорения повторных запусков
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 3600  # 1 час

# Логирование
log_path = ./logs/ansible.log

# Шаблон для именования временных файлов на удалённых хостах
remote_tmp = /tmp/.ansible-${USER}/tmp

# Привилегии: используем sudo для задач, требующих root
become = True
become_method = sudo
become_user = root

# Интерпретатор Python (для Ubuntu 22.04)
interpreter_python = auto_silent

[ssh_connection]
# Оптимизация SSH-соединений
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
retries = 3

# Сжатие для ускорения передачи больших файлов (плагины, артефакты)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o Compression=yes

[privilege_escalation]
# Настройки sudo
become = True
become_method = sudo
become_user = root
become_ask_pass = False