---
# ============================================================================
# ROLE: teamcity-agent
# Задача: Настройка и запуск TeamCity Agent контейнера
# ============================================================================

- name: "Создать директорию для конфигурации агента"
  file:
    path: /opt/teamcity-agent/conf
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: "Сгенерировать buildAgent.properties из шаблона"
  template:
    src: buildAgent.properties.j2
    dest: /opt/teamcity-agent/conf/buildAgent.properties
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  vars:
    # Передаём SERVER_URL для подключения к серверу
    server_url: "{{ server_url | default('http://teamcity-server:8111') }}"
    agent_name: "{{ agent_name | default(inventory_hostname) }}"

- name: "Запустить TeamCity Agent контейнер"
  docker_container:
    name: "{{ container_name | default('teamcity-agent') }}"
    image: "{{ docker_image | default('jetbrains/teamcity-agent:latest') }}"
    state: started
    restart_policy: unless-stopped
    env:
      # 🔑 SERVER_URL — обязательная переменная для авторегистрации [[20]]
      SERVER_URL: "{{ server_url }}"
      AGENT_NAME: "{{ agent_name | default(inventory_hostname) }}-agent"
    volumes:
      - "/opt/teamcity-agent/conf:/data/teamcity_agent/conf"
      - "/opt/buildagent/work:/opt/buildagent/work"  # Сохранение checkout
      - "/opt/buildagent/system:/opt/buildagent/system"  # Сохранение кэша
    ports: []  # Агент не требует внешних портов
  register: agent_container

- name: "Дождаться подключения агента к серверу"
  uri:
    url: "{{ server_url }}/app/rest/agents"
    method: GET
    status_code: [200, 401]  # 401 — нормально, если нет авторизации
  register: agents_list
  until: agents_list.json.agent is defined or agents_list.status == 401
  retries: 30
  delay: 10
  ignore_errors: true  # Не блокируем, если сервер ещё не готов

- name: "Вывести информацию о запуске"
  debug:
    msg: |
      ✅ TeamCity Agent запущен!
      📍 Конфигурация: /opt/teamcity-agent/conf
      🔗 SERVER_URL: {{ server_url }}
      📦 Контейнер: {{ agent_container.container.Name }}
      
      ⚠️  ВАЖНО: Авторизуйте агент в TeamCity UI:
         1. Откройте {{ server_url }}
         2. Перейдите в Administration → Agents
         3. Найдите агента "{{ agent_name }}" со статусом "Unauthorized"
         4. Нажмите "Authorize"
