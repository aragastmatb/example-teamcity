---
# ============================================================================
# ГЛАВНЫЙ PLAYBOOK: Оркестрация настройки всей инфраструктуры
# Запускается после Terraform apply для финальной конфигурации
# ============================================================================

- name: 🌐 Применить базовые настройки ко всем хостам
  hosts: all
  become: true
  gather_facts: true
  
  roles:
    # Базовая настройка ОС: обновления, пользователи, безопасность
    - role: base-system
      tags: [base, setup]
    
    # Установка Java и Maven (единая версия для всех компонентов)
    - role: java-maven
      tags: [java, maven, setup]
    
    # Настройка мониторинга и логирования (опционально)
    - role: monitoring
      when: enable_monitoring | default(false)
      tags: [monitoring, optional]

- name: 🗄️ Настроить Nexus Repository Manager
  hosts: nexus
  become: true
  gather_facts: true
  
  pre_tasks:
    - name: Установить приватный IP для шаблонов
      set_fact:
        nexus_private_ip: "{{ ansible_default_ipv4.address }}"
  
  roles:
    - role: nexus
      tags: [nexus, repo]
  
  post_tasks:
    - name: 📋 Вывести информацию о Nexus
      debug:
        msg: |
          ✅ Nexus настроен!
          
          🌐 Веб-интерфейс: http://{{ ansible_host }}:8081
          📦 Maven URL: http://{{ ansible_host }}:8081/repository/maven-public/
          
          🔑 Учётные данные для CI/CD (добавьте в TeamCity):
            - nexus.user = {{ nexus_ci_user }}
            - nexus.password = ******** (скрыто)
            - nexus.url = http://{{ ansible_host }}:8081

- name: 🏗️ Настроить TeamCity Server
  hosts: teamcity_server
  become: true
  gather_facts: true
  
  vars:
    # Передаём адрес Nexus для интеграции
    nexus_private_ip: "{{ hostvars['nexus']['ansible_default_ipv4']['address'] }}"
  
  roles:
    - role: teamcity-server
      tags: [teamcity, server]

- name: 👷 Настроить TeamCity Build Agent
  hosts: teamcity_agent
  become: true
  gather_facts: true
  
  vars:
    # Адрес сервера для подключения агента (внутренний IP)
    teamcity_server_url: "http://{{ hostvars['teamcity_server']['ansible_default_ipv4']['address'] }}:8111"
  
  roles:
    - role: teamcity-agent
      tags: [teamcity, agent]

- name: 🧪 Тестовая сборка (опционально, для проверки)
  hosts: teamcity_agent
  become: false  # Запускать от имени app_user
  gather_facts: false
  
  vars:
    test_repo: "{{ project_repo_url | default('https://github.com/aragastmatb/example-teamcity.git') }}"
    test_branch: "{{ project_branch | default('main') }}"
  
  tasks:
    - name: 📥 Клонировать тестовый репозиторий
      git:
        repo: "{{ test_repo }}"
        dest: "{{ app_home }}/test-build"
        version: "{{ test_branch }}"
        clone: yes
        update: no
      register: git_clone
      
    - name: 🛠 Запустить тестовую сборку
      command: mvn clean test -B
      args:
        chdir: "{{ app_home }}/test-build"
      environment:
        MAVEN_OPTS: "-Xmx512m"
      register: maven_test
      changed_when: false
      failed_when: maven_test.rc != 0
      
    - name: ✅ Вывести результат тестовой сборки
      debug:
        msg: |
          🎉 Тестовая сборка завершена!
          
          Репозиторий: {{ test_repo }}@{{ test_branch }}
          Статус: {% if maven_test.rc == 0 %}✅ УСПЕШНО{% else %}❌ ОШИБКА{% endif %}
          
          💡 Теперь можно импортировать проект в TeamCity через Web UI
      when: git_clone.changed or true
  tags: [test, smoke]
